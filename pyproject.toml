[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartrain"
version = "0.0.3"
description = "YOLO datasets, training queue, runs analytics — workspace-first CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "albumentations>=1.4.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "fpdf2>=2.7.0",
    "odfpy>=1.4.0",
]

[project.scripts]
smartrain = "smartrain.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["smartrain*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.9.0",
    "mypy>=1.13.0",
]
clearml = [
    "clearml>=1.14.0",
]
sahi = [
    "sahi>=0.11.0",
]
export = [
    "pypandoc-binary>=1.14.0",
    "weasyprint>=60.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Error fetching version info:UserWarning:albumentations\\.check_version",
    "ignore:ShiftScaleRotate is a special case of Affine transform\\. Please use Affine transform instead\\.:UserWarning:albumentations\\.core\\.validation",
    "ignore:The distutils package is deprecated and slated for removal in Python 3\\.12\\.:DeprecationWarning:redis\\.connection",
    "ignore::UserWarning:torch\\.autograd\\.graph",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E402", "E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = [
    "smartrain/core/runtime",
]

[[tool.mypy.overrides]]
module = [
    "smartrain.backends.*",
    "smartrain.run_model_contract.*",
]
ignore_errors = true
