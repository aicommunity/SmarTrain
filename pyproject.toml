[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartrain"
version = "0.0.1"
description = "YOLO datasets, training queue, runs analytics — workspace-first CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "albumentations>=1.4.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "fpdf2>=2.7.0",
    "odfpy>=1.4.0",
    "pypandoc-binary>=1.14.0",
    "weasyprint>=60.0",
]

[project.scripts]
smartrain = "smartrain.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["smartrain*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
clearml = [
    "clearml>=1.14.0",
]
sahi = [
    "sahi>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
