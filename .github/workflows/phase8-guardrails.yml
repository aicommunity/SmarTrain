name: phase8-guardrails

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Phase 8 guardrails
        run: python "scripts/ci/check_phase8_guardrails.py"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Layer boundary import guardrails
        run: python -m pytest tests/regression/test_layer_import_guardrails.py -q

      - name: Full test suite
        run: python -m pytest -q

      - name: Lint baseline guard
        run: python scripts/ci/check_lint_baseline.py

      - name: Ruff
        run: >-
          python -m ruff check
          smartrain/workflows/queue/training_queue.py
          smartrain/services/workspace/workspace_sync_service.py
          smartrain/services/datasets/data_yaml_writer.py
          smartrain/services/datasets/dataset_cli_common.py
          smartrain/services/datasets/dataset_convert_service.py
          smartrain/services/datasets/augment_transforms.py
          smartrain/services/testing/model_test_cli_surface.py
          smartrain/cli_entrypoints/help_texts.py
          smartrain/cli_entrypoints/cli_forwarding.py
          smartrain/cli_entrypoints/support/cli_interactive.py
          smartrain/core/runtime/logging_config.py
          smartrain/core/runtime/file_lock.py
          smartrain/core/runtime/run_refs.py
          smartrain/core/models
          smartrain/backends
          smartrain/services/registry
          tests/test_training_queue.py
          tests/test_workspace_sync_service.py
          tests/test_file_lock.py

      - name: Coverage gate (core / contract / backends)
        run: >-
          python -m pytest -q
          --cov=smartrain.core
          --cov=smartrain.run_model_contract
          --cov=smartrain.backends
          --cov-report=term-missing:skip-covered
          --cov-fail-under=40
          tests/regression/test_layer_import_guardrails.py
          tests/test_imports.py
          tests/test_registry_models_add.py
          tests/test_confidence_recommendation.py

      - name: Mypy
        run: >-
          python -m mypy
          smartrain/core/runtime/logging_config.py
          smartrain/core/runtime/file_lock.py
          smartrain/core/runtime/run_refs.py
          smartrain/services/datasets/data_yaml_writer.py
          smartrain/services/datasets/augment_transforms.py
